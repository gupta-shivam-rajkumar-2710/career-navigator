      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .grid-3 {

      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

        // =================== INTERACTIVE LOGIC ===================

        function calculatePrediction(e) {
            e.preventDefault();
            const examId = document.getElementById('target-exam').value;
            const score = parseFloat(document.getElementById('user-score').value);
            const category = document.getElementById('user-category').value;
            const resultBox = document.getElementById('prediction-result');

            let chance = 'Moderate';
            let color = 'accent-yellow';
            let summary = '';

            if (examId === 'jee-main') {
                if (score >= 95) { chance = 'High Probability'; color = 'accent-green'; summary = 'Strong eligibility for top-tier NIT core computer science or electronics departments.'; }
                else if (score >= 88) { chance = 'Moderate Probability'; color = 'accent-yellow'; summary = 'Viable for mid-tier NITs and leading state government technology colleges.'; }
                else { chance = 'Competitive / Backup Recommended'; color = 'accent-orange'; summary = 'Recommend evaluating state CETs or central university bachelor of science pathways.'; }
            } else if (examId === 'neet-ug') {
                if (score >= 620) { chance = 'High Probability'; color = 'accent-green'; summary = 'Likely qualification for state or central government medical colleges.'; }
                else if (score >= 540) { chance = 'Moderate'; color = 'accent-yellow'; summary = 'Competitive for BDS, BAMS, or state quota medical institutions.'; }
                else { chance = 'Low for Govt MBBS'; color = 'accent-red'; summary = 'Consider Allied Health Sciences or B.Sc. Biotechnology routes.'; }
            } else {
                chance = score >= 80 ? 'High' : 'Moderate';
                color = score >= 80 ? 'accent-green' : 'accent-yellow';
                summary = 'Your marks place you in a competitive bracket for premier central universities.';
            }

            resultBox.className = 'mt-6 p-4 rounded-xl border border-white/20 bg-white/5 animate-fade-in block';
            resultBox.innerHTML = `
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-bold text-white">Estimated Status:</span>
                    <span class="font-extrabold ${color}">${chance}</span>
                </div>
                <p class="text-xs text-secondary mb-3">${summary}</p>
                <div class="text-[11px] text-muted">Basis: Category (${category.toUpperCase()}) historical cutoff medians.</div>
            `;
            showNotification('Prediction generated successfully!', 'success');
        }

                        <p class="text-secondary">${stream.governmentCourses.join(', ')}</p>

                        <p class="font-bold text-white pt-2">Key Entrance Gateways:</p>
                        <p class="text-secondary">${stream.entranceExams.join(', ')}</p>

                        <div class="p-3 bg-white/5 rounded-lg mt-3">
                            <span class="font-bold text-green-400 block mb-1">Financial ROI Note:</span>
                            <span class="text-muted">${stream.affordability}</span>
                        </div>
                    </div>

                    <div class="flex justify-end pt-3">
                        <button class="btn-primary text-xs" onclick="closeModal()">Understood</button>
                    </div>
                </div>
            `);
        }

        function showCareerDetails(careerId) {
            const c = comprehensiveCareerPaths.find(item => item.id === careerId);
            if (!c) return;

            showModal(`
                <div class="space-y-4">
                    <div class="flex items-center gap-3">
                        <span class="text-4xl">${c.icon}</span>
                        <div>
                            <h3 class="text-xl font-bold accent-${c.color}">${c.title}</h3>
                            <span class="badge badge-${c.color} text-[10px]">${c.category}</span>
                        </div>
                    </div>

                    <p class="text-secondary text-sm">${c.description}</p>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="p-2 rounded bg-white/5">
                            <span class="text-muted block">Salary Spectrum</span>
                            <span class="font-bold text-white">${c.avgSalary}</span>
                        </div>
                        <div class="p-2 rounded bg-white/5">
                            <span class="text-muted block">Qualifying Exam</span>
                            <span class="font-bold accent-green">${c.examRequired}</span>
                        </div>
                    </div>

                    <div class="p-3 rounded bg-white/5 text-xs space-y-1">
                        <span class="font-bold text-white block">Government College Graduate Blueprint:</span>
                        <p class="text-secondary">${c.governmentCollegeRoute}</p>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button class="btn-primary text-xs" onclick="closeModal()">Close</button>
                    </div>
                </div>
            `);
        }

        function showCollegeDetails(id) {
            const college = [...governmentColleges, ...premiumInstitutes].find(c => c.id === id);
            if (!college) return;

            showModal(`
                <div class="space-y-4">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-xl font-bold accent-${college.color}">${college.name}</h3>
                            <p class="text-muted text-xs">${college.location}</p>
                        </div>
                        <span class="text-3xl">${college.icon}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <div class="p-2 rounded bg-white/5">
                            <span class="text-muted block">Tuition / Fees</span>
                            <span class="font-bold text-white">${college.fees}</span>
                        </div>
                        <div class="p-2 rounded bg-white/5">
                            <span class="text-muted block">Avg Package</span>
                            <span class="font-bold accent-green">${college.avgPackage || college.placement?.avgPackage}</span>
                        </div>
                    </div>

                    <div class="text-xs space-y-1">
                        <span class="font-bold text-white block">Programs Offered:</span>
                        <p class="text-secondary">${college.courses.join(', ')}</p>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button class="btn-primary text-xs" onclick="closeModal()">Close Details</button>
                    </div>
                </div>
            `);
        }

        function showScholarshipDetails(id) {
            const sch = scholarships.find(s => s.id === id);
            if (!sch) return;

            showModal(`
                <div class="space-y-4">
                    <h3 class="text-xl font-bold accent-${sch.color}">${sch.name}</h3>
                    <p class="text-xs text-muted">Offered by: ${sch.provider}</p>

                    <div class="p-3 rounded bg-white/5 text-xs space-y-2">
                        <p><strong>Funding Amount:</strong> <span class="accent-yellow font-bold">${sch.amount}</span></p>
                        <p><strong>Eligibility Conditions:</strong> ${sch.eligibility}</p>
                        <p><strong>Details:</strong> ${sch.description}</p>
                        <p><strong>Deadline:</strong> <span class="text-white font-bold">${sch.deadline}</span></p>
                    </div>

                    <div class="flex justify-end gap-2 pt-2">
                        <button class="btn-secondary text-xs" onclick="closeModal()">Close</button>
                        <button class="btn-primary text-xs" onclick="showNotification('Redirecting to official scholarship portal...', 'info')">Official Application</button>
                    </div>
                </div>
            `);
        }

        // =================== AI TUTOR CHAT ENGINE ===================

        function sendChatMessage() {
            const input = document.getElementById('ai-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `
                <div class="flex gap-2 justify-end">
                    <span class="text-white font-medium bg-blue-600/40 p-2 rounded-lg max-w-[80%]">${message}</span>
                </div>
            `;
            input.value = '';

            setTimeout(() => {
                let response = "That's a great question! For admission into state universities, prioritize standard regional counseling like CUET or State CETs. Focus consistently on foundational NCERT textbooks.";
                const lower = message.toLowerCase();

                if (lower.includes('b.tech') || lower.includes('alternative')) {
                    response = "Strong technical alternatives include B.Sc. Computer Science, BCA (Bachelor of Computer Applications), and B.Sc. Data Analytics. These offer practical programming foundations at a fraction of engineering tuition.";
                } else if (lower.includes('upsc') || lower.includes('civil')) {
                    response = "B.A. in Political Science, History, or Economics offers direct alignment with General Studies papers in UPSC CSE. It allows ample self-study time during graduation compared to laboratory-heavy courses.";
                } else if (lower.includes('inspire') || lower.includes('scholarship')) {
                    response = "The INSPIRE-SHE scholarship provides ₹80,000 annually to students in the top 1% of their Class 12 boards enrolled in basic science (B.Sc. Physics, Chemistry, Math, Biology).";
                }

                chatBox.innerHTML += `
                    <div class="flex gap-2">
                        <span class="accent-blue font-bold">Navigator AI:</span>
                        <span class="text-secondary bg-white/5 p-2 rounded-lg max-w-[80%]">${response}</span>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function insertQuickPrompt(text) {
            const input = document.getElementById('ai-input');
            if (input) {
                input.value = text;
                sendChatMessage();
            }
        }

        // =================== UTILITY & LIFECYCLE ===================

        function navigate(view) {
            currentView = view;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const activeNav = document.getElementById(`nav-${view}`);
            if (activeNav) activeNav.classList.add('active');

            switch(view) {
                case 'dashboard': renderDashboard(); break;
                case 'career-guide': renderEnhancedCareerGuide(); break;
                case 'stream-selector': renderStreamSelector(); break;
                case 'colleges': renderAllColleges(); break;
                case 'placements': renderPlacementsAndOpportunities(); break;
                case 'ai-tutor': renderAITutor(); break;
                case 'scholarships': renderScholarships(); break;
                case 'predictor': renderAdmissionPredictor(); break;
                default: renderDashboard();
            }

            if (view !== 'dashboard') {
                userProgress.xp += 15;
                updateStats();
            }
        }

        function updateStats() {
            const levelEl = document.getElementById('user-level');
            const xpStreakEl = document.getElementById('user-xp-streak');
            if (levelEl) levelEl.textContent = userProgress.level;
            if (xpStreakEl) xpStreakEl.textContent = `${userProgress.xp.toLocaleString()} XP • ${userProgress.streak} Day Streak`;
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const notification = document.createElement('div');
            notification.className = 'p-3 rounded-xl text-white shadow-xl animate-fade-in flex items-center justify-between text-xs font-medium border border-white/20';
            notification.style.background = type === 'success' 
                ? 'linear-gradient(135deg, #059669, #10b981)' 
                : 'linear-gradient(135deg, #2563eb, #3b82f6)';
            
            notification.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" class="ml-3 text-sm font-bold opacity-70 hover:opacity-100">&times;</button>
            `;
            container.appendChild(notification);
            setTimeout(() => { notification.remove(); }, 4000);
        }

        function showModal(content) {
            document.getElementById('modal-content').innerHTML = content;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
            updateStats();
        });
  </script>
</body>

</html>
