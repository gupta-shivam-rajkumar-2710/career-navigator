<!DOCTYPE html>
<html lang="en">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at 10% 20%, #4c1d95 0%, #1e1b4b 90%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.35);
    }
    .glass-subcard {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
    }
    .badge-chip {
      background: rgba(139, 92, 246, 0.35);
      border: 1px solid rgba(167, 139, 250, 0.4);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.45s ease-out forwards;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(168, 85, 247, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(168, 85, 247, 0.7);
    }
  </style>
</head>

              {
                type: "Master of Laws & Judiciary Examination",
                roles: [
                  { name: "Master of Laws (LL.M)", description: "Specialization in Intellectual Property (IPR), International Commercial Arbitration, or Cyber Law." },

      },

      "English": {
        name: "English & Global Communications",
        junior: {
          title: "Foundational Language & Literary Track (Classes 7-10)",
          focusSubjects: ["Advanced Grammar, Syntax & Lexicon", "Creative Writing & Prose Analysis", "Public Speech & Oratory"],
          activities: ["Book Clubs & Review Blogging", "Poetry Recitation & Slam Contests", "School Magazine Editorial Board"],

        sections: [

            fields: [

        postGrad: [
          {

                type: "Higher Literature & Media Management",
                roles: [
                  { name: "M.A. in English / Comparative Literature / Linguistics", description: "Specialized literary critique, publishing, and university professorship." },
                  { name: "MBA in Strategic Communications / Brand Management", description: "Translating strong linguistic and creative abilities into consumer brand campaigns." }

                exams: ["UGC NET", "CUET-PG", "CAT / GMAT"]

      "Government": {
        name: "Government / Public Service Ecosystem",
        sections: [
          {
            title: "The Multi-Tiered Public Employment Architecture",
            description: "The Indian public sector operates through an organized dichotomy of Central and State recruiting bodies with progressive elimination stages (Prelims -> Mains -> Interview/Skill Test).",
            fields: [
              {
                type: "Apex Central Civil Services (UPSC)",
                description: "The pinnacle of executive and diplomatic administration.",
                roles: [
                  { name: "IAS (Indian Administrative Service)", description: "District administration, policymaking, ministry implementation." },
                  { name: "IPS (Indian Police Service)", description: "Public order, investigative integrity, state and central police leadership." },
                  { name: "IFS (Indian Foreign Service)", description: "Diplomatic missions, international treaties, and bilateral commerce." }
                ],
                exams: ["UPSC Civil Services Exam (CSE) - 3 Stages: Prelims (GS + CSAT) -> Mains (9 Descriptive Papers) -> Personality Test"]
              },
              {
                type: "Staff Selection Commission (SSC)",
                description: "Recruitment for Group B & C gazetted and non-gazetted positions in central ministries.",
                roles: [
                  { name: "Income Tax Inspector, Assistant Section Officer (ASO), CBI Sub-Inspector", description: "Ministry policy execution, financial inspection, and central intelligence." }
                ],
                exams: ["SSC CGL (Tier 1 CBT screening + Tier 2 CBT merit & skill test)"]
              },
              {
                type: "Public Sector Banking (IBPS & SBI)",
                description: "Key drivers of national financial architecture with fast-track officer cadres.",
                roles: [
                  { name: "Probationary Officer (PO) & Specialist Officer (SO)", description: "Credit appraisal, treasury, retail lending, and branch operations." }
                ],
                exams: ["IBPS PO (Prelims, Mains, Interview)", "SBI PO (Prelims, Mains, Psychometric GD/PI)", "RBI Grade B"]
              },
              {
                type: "Indian Railways (RRB)",
                description: "World's largest railway enterprise, recruiting through technical and non-technical categories.",
                roles: [
                  { name: "Station Master, Goods Guard, Traffic Assistant", description: "Operational train management, logistics, and station administration." }
                ],
                exams: ["RRB NTPC (CBT 1, CBT 2, Computer-Based Aptitude / Typing Skill Test)"]
              },
              {
                type: "State-Level Public Service Commissions",
                description: "Administering provincial development, revenue, and state-level administration (e.g. UPPSC, MPSC, KPSC, TNPSC, BPSC).",

                exams: ["State PCS Exam (e.g., UPPSC PCS with state-specific General Studies papers, UPSSSC PET preliminary filter)"]
              }
            ]
          }
        ]
      }
    };

    // Form Submission Controller
    document.getElementById('guidance-form').addEventListener('submit', function (event) {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const rawClass = document.getElementById('class').value.trim();
      const numericClass = parseInt(rawClass.replace(/\D/g, ''), 10);
      const interest = document.getElementById('interest').value;
      const state = document.getElementById('state').value;
      const resultsContainer = document.getElementById('results-container');

      const domain = domains[interest];
      if (!domain) return;

      const stateData = stateExams[state];
      let html = '';

      const isJunior = !isNaN(numericClass) && numericClass >= 7 && numericClass <= 10;
      const isSenior = isNaN(numericClass) || numericClass > 10;

      // Personalized Profile Badge Header
      html += `
        <div class="glass-card rounded-2xl p-6 sm:p-8 mb-6 border border-white/20">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-white/10 pb-5">
            <div>
              <span class="text-xs uppercase tracking-widest text-purple-300 font-semibold">Custom Assessment For</span>
              <h2 class="text-2xl sm:text-3xl font-bold text-white mt-0.5">${name}</h2>
            </div>
            <div class="flex flex-wrap gap-2">
              <span class="badge-chip text-purple-200 text-xs font-medium px-3 py-1.5 rounded-full">
                Class: ${rawClass}
              </span>
              <span class="badge-chip text-indigo-200 text-xs font-medium px-3 py-1.5 rounded-full">
                State: ${state}
              </span>
              <span class="badge-chip text-pink-200 text-xs font-medium px-3 py-1.5 rounded-full">
                ${domain.name}
              </span>
            </div>
          </div>
      `;

      if (isJunior && domain.junior) {
        // Classes 7-10 Foundation View
        const j = domain.junior;
        html += `
          <div class="mt-6">
            <div class="inline-block px-3 py-1 bg-yellow-400/20 text-yellow-200 text-xs font-semibold rounded-md border border-yellow-400/30 mb-2">
              Junior Foundation Phase (Class 7-10)
            </div>
            <h3 class="text-xl sm:text-2xl font-bold text-purple-100">${j.title}</h3>
            <p class="text-sm text-purple-200/90 mt-1 mb-6">${j.why}</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="glass-subcard rounded-xl p-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-purple-300 mb-2">Focus Subjects</h4>
                <ul class="list-disc list-inside text-sm text-purple-100 space-y-1">
                  ${j.focusSubjects.map(sub => `<li>${sub}</li>`).join('')}
                </ul>
              </div>

              <div class="glass-subcard rounded-xl p-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-pink-300 mb-2">Recommended Activities</h4>
                <ul class="list-disc list-inside text-sm text-purple-100 space-y-1">
                  ${j.activities.map(act => `<li>${act}</li>`).join('')}
                </ul>
              </div>

              <div class="glass-subcard rounded-xl p-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-300 mb-2">Skills to Cultivate</h4>
                <ul class="list-disc list-inside text-sm text-purple-100 space-y-1">
                  ${j.skills.map(sk => `<li>${sk}</li>`).join('')}
                </ul>
              </div>

              <div class="glass-subcard rounded-xl p-4">
                <h4 class="text-xs font-bold uppercase tracking-wider text-emerald-300 mb-2">Target Foundation Olympiads & Exams</h4>
                <ul class="list-disc list-inside text-sm text-purple-100 space-y-1">
                  ${j.exams.map(ex => `<li>${ex}</li>`).join('')}
                </ul>
              </div>
            </div>

            <div class="mt-6 p-4 rounded-xl bg-purple-900/30 border border-purple-400/30">
              <h4 class="text-xs font-bold uppercase tracking-wider text-purple-200 mb-1">Downstream Future Careers Preview</h4>
              <p class="text-sm text-purple-100">${j.careers.join(' • ')}</p>
            </div>
          </div>
        `;
      } else if (isSenior) {
        html += `
          <div class="mt-6">
            <div class="inline-block px-3 py-1 bg-emerald-400/20 text-emerald-200 text-xs font-semibold rounded-md border border-emerald-400/30 mb-2">
              Undergraduate & Professional Specialization (Post-Class 10 / 12)
            </div>
            <p class="text-sm text-purple-200/90 mb-6">
              Comprehensive stream analysis detailing degree programs, state quota entrances for <strong>${state}</strong>, national gates, and master's credentials.
            </p>
        `;

        // Render main sections
        domain.sections.forEach(sec => {
          html += `
            <div class="mb-8">
              <h3 class="text-xl sm:text-2xl font-bold text-white mb-2">${sec.title}</h3>
              ${sec.description ? `<p class="text-sm text-purple-200/80 mb-4">${sec.description}</p>` : ''}
          `;

          if (sec.fields) {
            sec.fields.forEach(field => {
              html += `
                <div class="glass-subcard rounded-xl p-5 mb-4 border border-white/10">
                  <h4 class="text-base font-semibold text-purple-300 mb-1">${field.type}</h4>
                  ${field.description ? `<p class="text-xs text-purple-200/70 mb-3">${field.description}</p>` : ''}
              `;

              if (field.roles && field.roles.length > 0) {
                html += `<div class="space-y-2.5 my-3">`;
                field.roles.forEach(r => {
                  html += `
                    <div class="text-sm">
                      <strong class="text-purple-100 font-semibold">• ${r.name}:</strong> 
                      <span class="text-purple-200/90">${r.description}</span>
                    </div>
                  `;
                });
                html += `</div>`;
              }

              // Exams processing with state exam inject
              if (field.exams) {
                let examsList = [...field.exams];

                // Inject state engineering exam if STEM
                if (interest === 'STEM' && stateData && stateData.engineering) {
                  if (!examsList.includes(stateData.engineering)) {
                    examsList.unshift(`⭐ ${state} Quota: ${stateData.engineering}`);
                  }
                }

                // Inject state medical exam if Medical
                if (interest === 'Medical' && stateData && stateData.medical) {
                  if (!examsList.includes(stateData.medical)) {
                    examsList.unshift(`⭐ ${state} Quota: ${stateData.medical}`);
                  }
                }

                html += `
                  <div class="mt-4 pt-3 border-t border-white/10">
                    <span class="text-xs uppercase tracking-wider font-semibold text-purple-300">Key Entrance Exams:</span>
                    <div class="flex flex-wrap gap-2 mt-2">
                      ${examsList.map(e => `
                        <span class="px-2.5 py-1 text-xs font-medium rounded-lg bg-purple-500/30 text-purple-100 border border-purple-400/30">
                          ${e}
                        </span>
                      `).join('')}
                    </div>
                  </div>
                `;
              }

              html += `</div>`;
            });
          }

          html += `</div>`;
        });

        // Top Private Engineering Colleges Section (If PCM)
        if (domain.hasPrivateEngineering) {
          html += `
            <div class="glass-subcard rounded-xl p-5 mb-8 border border-amber-400/30 bg-amber-500/10">
              <div class="flex items-center gap-2 mb-2">
                <svg class="w-5 h-5 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                </svg>
                <h4 class="text-base font-bold text-amber-200">Top Premier Private College Engineering Entrances</h4>
              </div>
              <p class="text-xs text-amber-100/80 mb-3">
                Aside from JEE Main/Advanced, premier private universities conduct autonomous pan-India tests offering world-class placement ecosystems:
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">
                ${privateEnggExams.map((p, idx) => `
                  <div class="p-3 rounded-lg bg-black/20 border border-amber-400/20">
                    <div class="text-sm font-bold text-amber-300">${idx + 1}. ${p.name}</div>
                    <div class="text-xs text-amber-100/70 mt-0.5">${p.institute}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }

        // Post-Graduation Pathways (MBA, M.Tech, etc.)
        if (domain.postGrad) {
          html += `
            <div class="mb-8 pt-6 border-t border-white/20">
              <h3 class="text-xl sm:text-2xl font-bold text-white mb-2">After Undergraduate Studies (Master's & Beyond)</h3>
              <p class="text-xs sm:text-sm text-purple-200/80 mb-4">
                Advanced qualifications including technical specializations and cross-stream management leadership:
              </p>
          `;

          domain.postGrad.forEach(pg => {
            pg.fields.forEach(f => {
              html += `
                <div class="glass-subcard rounded-xl p-5 mb-4 border border-indigo-400/20">
                  <h4 class="text-base font-semibold text-indigo-300 mb-2">${f.type}</h4>
                  <div class="space-y-2 mb-3">
                    ${f.roles.map(r => `
                      <div class="text-sm">
                        <strong class="text-purple-100 font-semibold">• ${r.name}:</strong> 
                        <span class="text-purple-200/90">${r.description}</span>
                      </div>
                    `).join('')}
                  </div>
                  ${f.exams ? `
                    <div class="mt-3 pt-2.5 border-t border-white/10 text-xs">
                      <span class="text-purple-300 font-semibold uppercase tracking-wider">Top Exams:</span>
                      <span class="text-purple-100 font-medium ml-1.5">${f.exams.join(', ')}</span>
                    </div>
                  ` : ''}
                </div>
              `;
            });
          });

          html += `</div>`;
        }

        // Universal Government Jobs Overview if not already viewing Government stream
        if (interest !== "Government") {
          html += `
            <div class="pt-6 border-t border-white/20">
              <div class="flex items-center gap-2 mb-2">
                <svg class="w-5 h-5 text-emerald-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                </svg>
                <h3 class="text-xl font-bold text-white">Public Service & Central / State Competitive Exams</h3>
              </div>
              <p class="text-xs sm:text-sm text-purple-200/80 mb-4">
                Graduates from any stream (${domain.name}) are uniformly eligible to apply for gazetted and administrative government cadres:
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="p-3.5 rounded-xl bg-purple-900/30 border border-purple-400/20 text-xs">
                  <div class="font-bold text-purple-200 text-sm mb-1">UPSC Civil Services</div>
                  <div class="text-purple-100/80">Recruits IAS, IPS, and IFS via Prelims, Mains, and Personality Interview.</div>
                </div>
                <div class="p-3.5 rounded-xl bg-purple-900/30 border border-purple-400/20 text-xs">
                  <div class="font-bold text-purple-200 text-sm mb-1">SSC CGL & Banking</div>
                  <div class="text-purple-100/80">Officers in Central Ministries, IBPS, and SBI PO without mandatory degree percentage limits.</div>
                </div>
                <div class="p-3.5 rounded-xl bg-purple-900/30 border border-purple-400/20 text-xs">
                  <div class="font-bold text-purple-200 text-sm mb-1">${state} State PSC</div>
                  <div class="text-purple-100/80">Provincial administrative services with special state domicile quota opportunities.</div>
                </div>
              </div>
            </div>
          `;
        }

        html += `</div>`;
      } else {
        // Below class 7 fallback
        html += `
          <div class="p-4 rounded-xl bg-white/10 text-sm text-purple-200 mt-4">
            Hello, <strong>${name}</strong>! It's fantastic that you are exploring potential directions early. Focus on finding what excites you through reading, experiments, and hobbies.
          </div>
        `;
      }

      html += `</div>`; // Close card

      resultsContainer.innerHTML = html;
      resultsContainer.classList.remove('hidden');
      resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Reset button handler
    document.getElementById('reset-btn').addEventListener('click', function () {
      const resultsContainer = document.getElementById('results-container');
      resultsContainer.classList.add('hidden');
      resultsContainer.innerHTML = '';
    });
  </script>
</body>
</html>
